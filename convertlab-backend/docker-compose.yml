services:
  db:
    image: postgres:latest
    container_name: convertlab_db
    restart: always
    environment:
      # Explicitly mapping from .env to the Postgres internal variable names
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  backend:
    build: .
    container_name: convertlab_backend
    depends_on:
      - db
    ports:
      - "${HOST_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      # Tells Spring Boot to connect to the 'db' container on the internal network
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

volumes:
  postgres_data: