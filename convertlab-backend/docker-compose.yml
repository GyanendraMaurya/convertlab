services:
  db:
    image: pgvector/pgvector:pg16
    container_name: convertlab_db
    restart: always
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - /pgdata/postgres:/var/lib/postgresql/data
#      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: convertlab_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8081}:8080"
    env_file:
      - .env
    environment:
      # Tells Spring Boot to connect to the 'db' container on the internal network
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}

#For local development, you can uncomment the volumes section to persist PostgreSQL data on your host machine. Make sure to create the directory /pgdata/postgres on your host before running docker-compose.
#volumes:
#  postgres_data: