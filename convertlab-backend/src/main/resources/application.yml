spring:
  application:
    name: ${SPRING_APPLICATION_NAME:convertlab-backend}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:75MB}
      max-request-size: ${MAX_REQUEST_SIZE:90MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  tomcat:
    max-swallow-size: ${MAX_SWALLOW_SIZE:200MB}

temp:
  folder: ${TEMP_FOLDER:temp-files}
  ttl-ms: ${TEMP_TTL_MS:1800000}
  cleanup-interval-ms: ${TEMP_CLEANUP_INTERVAL_MS:1800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  version: 1.2.0
  build-time: @maven.build.timestamp@
  cookie:
    secure: ${COOKIE_SECURE:true}
    same-site: ${SAME_SITE:strict}
  jwt:
    cleanup-cron: ${JWT_CLEANUP_CRON:0 0 3 * * *}   # 3 AM every day
  security:
    super-admin-emails: ${SUPER_ADMIN_EMAILS:}
  contact:
    to-email: ${CONTACT_TO_EMAIL:gmaurya973@gmail.com}
  proxy:
    trusted-cidrs: ${TRUSTED_PROXY_CIDRS:127.0.0.0/8,::1/128}

validation:
  pdf:
    max-size-mb: ${VALIDATION_PDF_MAX_SIZE_MB:25}
    authenticated-max-size-mb: ${VALIDATION_PDF_AUTHENTICATED_MAX_SIZE_MB:75}
    min-size-kb: 1
    max-pages: 1000
  image:
    max-size-mb: ${VALIDATION_IMAGE_MAX_SIZE_MB:10}
    authenticated-max-size-mb: ${VALIDATION_IMAGE_AUTHENTICATED_MAX_SIZE_MB:50}
    min-size-kb: 1
    max-dimension-px: 10000
    allowed-extensions: png,jpg,jpeg,gif,bmp,webp

#management:
#  endpoints:
#    web:
#      exposure:
#        include: "*"

geo:
  location:
    api:
      url: ${GEO_LOCATION_API_URL}
      key: ${GEO_LOCATION_API_KEY}

jwt:
  # Use at least 32-char random strings. In production inject via environment variables:
  #   JWT_ACCESS_SECRET, JWT_REFRESH_SECRET
  access-secret:  ${JWT_ACCESS_SECRET:local-dev-access-secret-min32chars!!}
  refresh-secret: ${JWT_REFRESH_SECRET:local-dev-refresh-secret-min32chars!}

openai:
  api:
    key: ${OPENAI_API_KEY}
  base-url: ${OPENAI_API_BASE_URL}

ai:
  rate-limit:
    # Per authenticated user: max PDF ingestions per calendar day
    user-daily-ingest-limit: ${AI_USER_DAILY_INGEST_LIMIT:5}

    # Per authenticated user: max RAG queries per calendar day
    user-daily-query-limit: ${AI_USER_DAILY_QUERY_LIMIT:20}

    # Per IP: ingest requests allowed per minute (token bucket)
    ip-ingest-per-minute: ${AI_IP_INGEST_PER_MINUTE:5}

    # Per IP: query requests allowed per minute (token bucket)
    ip-query-per-minute: ${AI_IP_QUERY_PER_MINUTE:15}

google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID}
