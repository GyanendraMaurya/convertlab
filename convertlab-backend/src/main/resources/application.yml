spring:
  application:
    name: ${SPRING_APPLICATION_NAME:convertlab-backend}

  servlet:
    multipart:
      enabled: true
      max-file-size: ${MAX_FILE_SIZE:15MB}
      max-request-size: ${MAX_REQUEST_SIZE:50MB}

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/api}
  tomcat:
    max-swallow-size: ${MAX_SWALLOW_SIZE:200MB}

temp:
  folder: ${TEMP_FOLDER:temp-files}
  ttl-ms: ${TEMP_TTL_MS:1800000}
  cleanup-interval-ms: ${TEMP_CLEANUP_INTERVAL_MS:1800000}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  version: 1.2.0
  build-time: @maven.build.timestamp@

validation:
  pdf:
    max-size-mb: 15
    min-size-kb: 1
    max-pages: 1000
  image:
    max-size-mb: 10
    min-size-kb: 1
    max-dimension-px: 10000
    allowed-extensions: png,jpg,jpeg,gif,bmp,webp
