<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #sidenav [opened]="sidenavOpened()" [mode]="'over'" [position]="'start'" (closedStart)="closeSidenav()">
    <div class="sidenav-header">
      <h2>Menu</h2>
      <button mat-icon-button (click)="closeSidenav()" aria-label="Close menu" class="close-button">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <!-- DocMind AI featured entry -->
    <div class="docmind-sidenav-item">
      <a mat-list-item [routerLink]="['/doc-mind']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/doc-mind')" class="docmind-sidenav-link">
        <span class="docmind-sidenav-icon">🧠</span>
        <span matListItemTitle class="docmind-sidenav-title">
          DocMind
          <span class="docmind-sidenav-badge">AI</span>
        </span>
        <span class="docmind-sidenav-pulse"></span>
        <span class="docmind-sidenav-pulse pulse-2"></span>
      </a>
    </div>

    <mat-divider></mat-divider>

    <mat-nav-list class="sidenav-tools">
      <h3 mat-subheader>PDF Tools</h3>

      <a mat-list-item [routerLink]="['/merge-pdf']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/merge-pdf')">
        <mat-icon matListItemIcon>merge</mat-icon>
        <span matListItemTitle>Merge PDF</span>
      </a>

      <a mat-list-item [routerLink]="['/extract-pdf']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/extract-pdf')">
        <mat-icon matListItemIcon>content_cut</mat-icon>
        <span matListItemTitle>Extract PDF</span>
      </a>

      <a mat-list-item [routerLink]="['/split-pdf']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/split-pdf')">
        <mat-icon matListItemIcon>splitscreen</mat-icon>
        <span matListItemTitle>Split PDF</span>
      </a>

      <a mat-list-item [routerLink]="['/compress-pdf']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/compress-pdf')">
        <mat-icon matListItemIcon>compress</mat-icon>
        <span matListItemTitle>Compress PDF</span>
      </a>
      <a mat-list-item [routerLink]="['/pdf-password']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/pdf-password')">
        <mat-icon matListItemIcon>lock</mat-icon>
        <span matListItemTitle>PDF Password</span>
      </a>

      <h3 mat-subheader>Image Tools</h3>

      <a mat-list-item [routerLink]="['/image-to-pdf']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/image-to-pdf')">
        <mat-icon matListItemIcon>image</mat-icon>
        <span matListItemTitle>Image to PDF</span>
      </a>

      <a mat-list-item [routerLink]="['/compress-image']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/compress-image')">
        <mat-icon matListItemIcon>compress</mat-icon>
        <span matListItemTitle>Compress Images</span>
      </a>

      <a mat-list-item [routerLink]="['/crop-image']" (click)="closeSidenav()"
        [class.active-list-item]="isActive('/crop-image')">
        <mat-icon matListItemIcon>crop</mat-icon>
        <span matListItemTitle>Crop Image</span>
      </a>
      <mat-divider></mat-divider>

      <!-- Future options section -->
      <!-- <h3 mat-subheader>Coming Soon</h3>

      <a mat-list-item disabled>
        <mat-icon matListItemIcon>crop_rotate</mat-icon>
        <span matListItemTitle>Crop Images</span>
      </a> -->

    </mat-nav-list>

    <div class="sidenav-footer">
      <mat-divider></mat-divider>
      <a mat-list-item [routerLink]="['/about']" (click)="closeSidenav()" [class.active-list-item]="isActive('/about')">
        <mat-icon matListItemIcon>person</mat-icon>
        <span matListItemTitle>About</span>
      </a>
      <a mat-list-item [routerLink]="['/contact']" (click)="closeSidenav()" [class.active-list-item]="isActive('/contact')">
        <mat-icon matListItemIcon>mail</mat-icon>
        <span matListItemTitle>Contact</span>
      </a>
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-navbar (menuToggle)="toggleSidenav()"></app-navbar>

    <div class="app-layout">
      <main class="app-content">
        <router-outlet></router-outlet>
      </main>
    </div>

    <app-version-display></app-version-display>
  </mat-sidenav-content>
</mat-sidenav-container>
