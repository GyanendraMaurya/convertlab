<nav>
  <button mat-icon-button (click)="onMenuClick()" aria-label="Toggle menu">
    <mat-icon>menu</mat-icon>
  </button>

  <button matButton="text" [routerLink]="['/']">
    <mat-icon class="medium-icon">home</mat-icon>
    <span class="brand-text">ConvertLab</span>
  </button>
  <span class="extra-nav-links">
    <a matButton="text" class="nowrap tool-link tool-merge" [routerLink]="['/merge-pdf']" routerLinkActive="active-link">Merge PDF</a>
    <a matButton="text" class="nowrap tool-link tool-split" [routerLink]="['/split-pdf']" routerLinkActive="active-link">Split PDF</a>
    <a matButton="text" class="nowrap tool-link tool-compress-pdf" [routerLink]="['/compress-pdf']" routerLinkActive="active-link">Compress PDF</a>
    <a matButton="text" class="nowrap tool-link tool-image-to-pdf" [routerLink]="['/image-to-pdf']" routerLinkActive="active-link">Image to PDF</a>
    <a matButton="text" class="nowrap tool-link tool-compress-image" [routerLink]="['/compress-image']" routerLinkActive="active-link">Compress Image</a>
    <a matButton="text" class="nowrap tool-link tool-crop-image" [routerLink]="['/crop-image']" routerLinkActive="active-link">Crop Image</a>
  </span>
  <span class="spacer"></span>
   <!-- DocMind AI button -->
  <a class="docmind-nav-btn" [routerLink]="['/docmind']" routerLinkActive="active-link" aria-label="DocMind AI">
    <span class="docmind-orb">🧠</span>
    <span class="docmind-label hide-mobile">DocMind <span class="ai-tag">AI</span></span>
    <span class="docmind-pulse-ring"></span>
    <span class="docmind-pulse-ring ring-2"></span>
  </a>

  @if (isAuthenticated()) {
  <!-- Profile Menu -->
  <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-button">
    <div class="profile-circle">{{ userInitial() }}</div>
  </button>
  <mat-menu #profileMenu="matMenu" xPosition="before">
    <div class="profile-menu-header" mat-menu-item disabled>
      <div class="profile-circle-large">{{ userInitial() }}</div>
      <div class="profile-info">
        <div class="profile-email">{{ userEmail() }}</div>
      </div>
    </div>
    <!-- <mat-divider></mat-divider>
    <button mat-menu-item [routerLink]="['/']">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </button> -->
    <button mat-menu-item (click)="deleteAccount()" class="delete-button">
      <mat-icon>delete</mat-icon>
      <span>Delete Account</span>
    </button> 
    <mat-divider></mat-divider>
    <button mat-menu-item (click)="onLogout()">
      <mat-icon>logout</mat-icon>
      <span>Logout</span>
    </button>
  </mat-menu>
  } @else {
  <!-- Login/Signup for non-authenticated users -->
  <a mat-button [routerLink]="['/login']" class="auth-button">
    <mat-icon>login</mat-icon>
    <span class="hide-mobile">Login</span>
  </a>
  }
</nav>
